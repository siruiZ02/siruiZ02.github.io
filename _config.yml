# ============================================================
#  网站全局设置 —— 你的个人信息基本都在这个文件里改
#  改完这个文件后，GitHub 需要 1~2 分钟重新生成网站
# ============================================================

title: Congcong Miao                       # 浏览器标签页上显示的标题
description: 

# 部署地址：把 your-username 换成你的 GitHub 用户名
url: "https://siruiz02.github.io"
baseurl: ""                           # 保持为空，不要删掉这一行

# ---------------- 个人信息（首页左上的名片） ----------------
author:
  name: Congcong Miao                      # 论文作者列表里会自动把这个名字加粗
  role:                   # 名字下面那行斜体
  photo: /assets/img/photo.jpg        # 把你的照片放到 assets/img/photo.jpg
  initials: CM                        # 没放照片时圆圈里显示的字母

# 名片里那一列带图标的链接。不要的整行删掉；想加就照格式复制一行。
# icon 用的是 Font Awesome 6 的图标名：https://fontawesome.com/search?o=r&m=free
contact:
  - icon: fa-solid fa-location-dot
    text: 
  - icon: fa-solid fa-envelope
    text: congcongmiao@163.com
    url: mailto:siruili@kaist.ac.kr
  - icon: fa-brands fa-github
    text: GitHub
    url: https://github.com/your-username
  - icon: fa-solid fa-graduation-cap
    text: Google Scholar
    url: https://scholar.google.com/
  - icon: fa-brands fa-linkedin-in
    text: LinkedIn
    url: https://www.linkedin.com/
  - icon: fa-brands fa-x-twitter
    text: X / Twitter
    url: https://x.com/

# ---------------- 顶部导航栏 ----------------
# 顺序就是显示顺序。新增页面：在根目录建一个 xxx.md，再在这里加一行。
nav:
  - title: Bio
    url: /
  - title: Mentorship
    url: /mentorship/
  - title: Publications
    url: /publications/
  - title: Talks
    url: /talks/

# 首页 News 最多显示几条（全部新闻写在 _data/news.yml）
news_limit: 6

# ---------------- 以下一般不用动 ----------------
markdown: kramdown
permalink: pretty
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
